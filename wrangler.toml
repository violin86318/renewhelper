name = "renewhelper"
main = "_worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "renew.1986318.xyz", custom_domain = true }
]

[env.production]
name = "renewhelper"

[env.staging]
name = "renewhelper-staging"

# 绑定 KV 数据库
# 注意：在一键部署过程中，Cloudflare 会提示您创建一个新的 KV 并自动填充 ID
[[kv_namespaces]]
binding = "RENEW_KV"
id = "d904e391d32a4c0abdeda098e821d956"
preview_id = "d904e391d32a4c0abdeda098e821d956"

# 设置定时任务 (Cron Triggers)
# 这里设置每 30 分钟检查一次 (0,30 * * * *)
# 必须设置这个，否则自动续期和通知功能无法触发
[triggers]
crons = ["0,30 * * * *"]

# 环境变量默认值 (可选)
# 部署时通常会提示用户输入，这里作为默认值
[vars]

